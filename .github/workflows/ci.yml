name: lab-integrity

# This lab is vulnerable BY DESIGN. CI does NOT assert "the code is secure" —
# it asserts the teaching artifact still works: deps install, every module
# parses, the pure auth.js/store.js functions behave correctly in isolation
# (unit tests), and the two-way gate holds across all six scenarios plus the
# all-fixed hardened build. Two-way means both halves: in each vuln build the
# exploit reproduces (and a correctly-scoped sibling still denies, proving an
# outlier rather than a globally broken server), and in each fixed build it is
# blocked without over-blocking legitimate same-tenant or admin access. A green
# check = the lab demonstrates every bug and every fix exactly as the README
# documents. (No CodeQL: it would simply re-flag the intentionally planted
# BOLA — verified off, `code-scanning/default-setup` reports "not-configured".)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-way-gate:
    name: two-way gate (vuln exploits, fix blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20"
      - name: install dependencies
        run: npm install --no-audit --no-fund
      - name: syntax check (all modules parse)
        run: |
          node --check src/server.js
          node --check src/auth.js
          node --check src/store.js
          node --check src/tools.js
          node --check poc/exploit.js
          node --check test/auth.test.js
          node --check test/store.test.js
      - name: unit tests (auth.js + store.js pure functions, node:test)
        run: npm test
      - name: two-way gate (npm run poc — exit 0 = gate held)
        run: npm run poc

  detection-rules:
    name: detection-rule fixtures (5 rules x vuln/ok pair)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install semgrep
        run: pip install --quiet semgrep
      - name: scan fixtures, assert exact expected finding count
        run: |
          semgrep --config detection/semgrep/mcp-object-authz.yml \
            detection/semgrep/fixtures/ --no-git-ignore --quiet --json \
            --output=/tmp/semgrep-fixtures.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/semgrep-fixtures.json", "utf8"));
            const got = d.results.length;
            const want = 8; // 5 rules. mcp-wildcard-sentinel-scope-bypass double-reports
                             // its one vuln line (two pattern-either branches), and
                             // mcp-client-supplied-scope-overrides-session has three vuln
                             // cases: org_id, user_id and owner_id (the last two added
                             // after CVE-2026-9135 — see detection/README.md).
            console.log(`detection rules: ${got} fixture findings (want ${want})`);
            if (got !== want) {
              console.error("Rule set drifted from its own fixtures — see detection/README.md");
              process.exit(1);
            }
          '

  dogfood-action-on-self:
    name: dogfood — run action.yml against this lab's own (vulnerable) src/
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    # RED IS EXPECTED HERE. src/ is intentionally vulnerable by design (see
    # README) — a red X on this job is live proof the action actually
    # detects the bug class end-to-end, not a broken workflow. continue-on-
    # error keeps it from blocking the rest of CI on that expected failure.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run the action against this repo's own src/
        uses: ./
        with:
          path: src/
          # src/ is intentionally vulnerable; don't pollute the real
          # Security tab with lab findings that aren't actual repo bugs.
          upload-sarif: 'false'
