name: lab-integrity

# This lab is vulnerable BY DESIGN. CI does NOT assert "the code is secure" —
# it asserts the teaching artifact still works: deps install, every module
# parses, the pure auth.js/store.js functions behave correctly in isolation
# (unit tests), and the two-way gate holds across all seven scenarios plus the
# all-fixed hardened build. Two-way means both halves: in each vuln build the
# exploit reproduces (and a correctly-scoped sibling still denies, proving an
# outlier rather than a globally broken server), and in each fixed build it is
# blocked without over-blocking legitimate same-tenant or admin access. A green
# check = the lab demonstrates every bug and every fix exactly as the README
# documents. (No CodeQL: it would simply re-flag the intentionally planted
# BOLA — verified off, `code-scanning/default-setup` reports "not-configured".)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-way-gate:
    name: two-way gate (vuln exploits, fix blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "20"
      - name: install dependencies
        run: npm install --no-audit --no-fund
      - name: syntax check (all modules parse)
        run: |
          node --check src/server.js
          node --check src/auth.js
          node --check src/store.js
          node --check src/tools.js
          node --check poc/exploit.js
          node --check test/auth.test.js
          node --check test/store.test.js
      - name: unit tests (auth.js + store.js pure functions, node:test)
        run: npm test
      - name: two-way gate (npm run poc — exit 0 = gate held)
        run: npm run poc

  detection-rules:
  # The job name carries NO count on purpose. Branch protection pins a
  # required check by its exact display name, so a name like
  # "(5 rules x vuln/ok pair)" silently stops matching the moment a rule
  # is added -- the check never reports and main becomes unmergeable. That
  # happened on 2026-08-22, minutes after the protection was configured.
  # The count lives in the `want` assertion below, which is the only place
  # it can be wrong loudly.
    name: detection-rule fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install semgrep
        run: pip install --quiet semgrep
      - name: scan fixtures, assert exact expected finding count
        run: |
          semgrep --config detection/semgrep/ \
            detection/semgrep/fixtures/ --no-git-ignore --quiet --json \
            --output=/tmp/semgrep-fixtures.json
          # NOTE: everything below is inside a single-quoted shell string.
          # One apostrophe ("fixture's") closes it early and the rest is
          # parsed as bash -- which is how this job failed on 2026-08-22
          # with "syntax error near unexpected token '('", nothing to do
          # with semgrep or the rules.
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/semgrep-fixtures.json", "utf8"));
            const got = d.results.length;
            const want = 41; // 21 JavaScript + 14 Python + 3 Go + 3 Rust.
                             //   JS (21): mcp-wildcard-sentinel-scope-bypass
                             //   double-reports its one vuln line (two
                             //   pattern-either branches), and
                             //   mcp-client-supplied-scope-overrides-session has
                             //   three vuln cases (org_id, user_id, owner_id).
                             //   Unguarded admin handlers in
                             //   admin-named-tool-missing-role-check.js and
                             //   toggle-blindness.js each carry a SECOND,
                             //   deliberate finding from
                             //   mcp-missing-object-authz-check: with no role
                             //   check anywhere, the read path is also
                             //   unauthorized -- two true signals, one handler.
                             //   S8 adds one (mcp-resource-uri-variable-used-as-scope,
                             //   resource-uri-variable-used-as-scope.js) -- its
                             //   fixed build and its no-tenant-segment sibling
                             //   both stay silent by design (session-derived
                             //   scope), so one ruleid line, not two.
                             //   Python (14): three shared rules plus five -py
                             //   siblings (batch, admin-tool, unscoped-query,
                             //   write-parent, ternary), plus the new S8 -py
                             //   sibling. The wildcard fixture double-report
                             //   repeats here, and two negative cases (a
                             //   tokenizer, a glob compare) stay deliberately
                             //   silent.
            console.log(`detection rules: ${got} fixture findings (want ${want})`);
            if (got !== want) {
              console.error("Rule set drifted from its own fixtures — see detection/README.md");
              process.exit(1);
            }
          '

  dogfood-action-on-self:
    name: dogfood — the action must FIND the planted vulnerabilities in src/
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    # src/ is intentionally vulnerable by design (see README), so the action
    # exiting 1 here is the SUCCESS case, not the failure case. This job used
    # to let that exit code stand as the job result under continue-on-error,
    # which inverted the signal: a working detector painted the job red, and a
    # detector that silently stopped finding anything — a broken ruleset, a
    # semgrep that scanned the wrong path — exited 0 and painted it GREEN. The
    # one outcome that must never pass quietly was the only one that did.
    #
    # So the scan's exit code is absorbed at the STEP (expected), and the job
    # result comes from an assertion that separates three outcomes a bare exit
    # code cannot: no SARIF at all (the scan never ran), SARIF with zero
    # findings (the detector is broken, not the tree clean), and SARIF with
    # findings (working). Green now means "proven end-to-end".
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: run the action against this repo's own src/
        id: scan
        # Expected: the action exits 1 on findings, and findings are the point.
        continue-on-error: true
        uses: ./
        with:
          path: src/
          # src/ is intentionally vulnerable; don't pollute the real
          # Security tab with lab findings that aren't actual repo bugs.
          upload-sarif: 'false'

      - name: assert the detector actually fired
        shell: bash
        run: |
          sarif="$GITHUB_WORKSPACE/mcp-objauthz-results.sarif"
          if [ ! -f "$sarif" ]; then
            echo "::error::no SARIF produced — the scan never ran (scan step outcome: ${{ steps.scan.outcome }}). This is a broken workflow, not a clean tree."
            exit 1
          fi
          count=$(python3 -c "
          import json, sys
          d = json.load(open(sys.argv[1], encoding='utf-8'))
          print(sum(len(r['results']) for r in d['runs']))
          " "$sarif")
          echo "planted-vulnerability findings: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::the detector found NOTHING in an intentionally vulnerable tree — the ruleset or its wiring is broken. An empty result here is a regression, never a pass."
            exit 1
          fi
          echo "OK: the action flagged $count finding(s) end-to-end against src/"
