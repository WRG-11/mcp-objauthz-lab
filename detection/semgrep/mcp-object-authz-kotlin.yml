rules:
- id: mcp-authz-scope-from-request-header-kotlin
  languages:
  - kotlin
  severity: WARNING
  message: A Ktor/Spring MCP tool reads a tenant/identity header (X-Org-Id, X-Forwarded-For, ...) from the HTTP request and USES IT to select the authorization scope (e.g., passes it to a repository list call, binds it as orgId in a query). A request header is entirely client-controlled -- any caller sets it -- so it must never decide whose data a tool returns. Derive the scope from the server-trusted session instead. CWE-639/CWE-290 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s10--forwarded-header-as-scope
  # Taint mode: the header read and the scoping call are separate statements.
  # The earlier version put both under one `patterns` (which must match the
  # same range), compared header names without their quotes, and referenced
  # $KEY that no pattern bound, so it matched nothing.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $C.request.header($HDR)
      - pattern: $C.request.headers[$HDR]
    - metavariable-regex:
        metavariable: $HDR
        regex: (?i)^"(x-org-id|x-org|x-tenant-id|x-tenant|x-workspace-id|x-account-id|x-customer-id|x-project-id|x-user-id|x-forwarded-for|x-real-ip|x-client-ip)"$
  # A Spring @RequestHeader parameter is the header value itself.
  - patterns:
    - pattern-inside: |
        fun $FUNC(..., @RequestHeader($HDR) $P: $T, ...) { ... }
    - pattern: $P
    - metavariable-regex:
        metavariable: $HDR
        regex: (?i)^"(x-org-id|x-org|x-tenant-id|x-tenant|x-workspace-id|x-account-id|x-customer-id|x-project-id|x-user-id|x-forwarded-for|x-real-ip|x-client-ip)"$
  pattern-sinks:
  # The scoping call is the sink; named arguments (`orgId = v`) travel inside
  # it. Quota and rate-limit calls are S11.
  - patterns:
    - pattern-either:
      - pattern: $REPO.$METHOD(..., $ARG, ...)
      # Semgrep's Kotlin parser does not match a named argument with $ARG.
      - pattern: $REPO.$METHOD(..., $NAME = $ARG, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: (?i)^(?!.*(quota|rate_?limit))(list|find|get|search|query|select).*
  metadata:
    cwe:
    - CWE-639
    - CWE-290
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s10--forwarded-header-as-scope
    provenance: "POOL (modelcontextprotocol/kotlin-sdk KtorServer.kt, PortSwigger/mcp-server, burp-ai-agent) + ECO (Ktor auth interceptors) - CANONICAL S10: header directly indexes transport/session map"

- id: mcp-wildcard-sentinel-scope-bypass-kotlin
  languages:
  - kotlin
  severity: ERROR
  message: A magic "all" or "*" sentinel value on a scope parameter is honored in an AUTHORIZATION CONTEXT (it controls whether to widen scope and return all tenants' data) without a role check. A textual "*" or "all" comparison in markup rendering, UI filters, or logging is NOT an authz decision and must stay silent. Gate wildcard scope on an explicit requireAdminRole()-style check, not on the parameter's literal value. CWE-639 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s4--wildcardsentinel-bypass
  patterns:
  - pattern-either:
      - pattern: $PARAM == "*"
      - pattern: $PARAM == "all"
  - metavariable-regex:
      metavariable: $PARAM
      regex: (?i).*(scope|org|tenant|project|team|workspace|account|user|owner|group|realm|namespace).*
  - pattern-either:
      - pattern: |
          if ($PARAM == "*") {
            ...
            $REPO.$METHOD()
            ...
          }
      - pattern: |
          if ($PARAM == "all") {
            ...
            $REPO.$METHOD()
            ...
          }
      - pattern: |
          when ($PARAM) {
            "*", "all" -> $REPO.$METHOD()
          }
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab

- id: mcp-unscoped-query-object-fetch-kotlin
  languages:
  - kotlin
  severity: WARNING
  message: An object is fetched by id through a query filter that carries no tenant key (workspaceId / projectId / organizationId / orgId / tenantId / accountId / userId / ownerId). If the entity is multi-tenant, the query matches on id alone and any caller's id resolves regardless of tenant -- the query-scoped form of object-level authorization failure (BOLA / IDOR, CWE-639). Bind the tenant key into the same filter, sourced from the session. CWE-639 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query
  patterns:
  - pattern-either:
      - pattern: $REPO.findByIdOrNull($ID)
      - pattern: $REPO.findById($ID)
      - pattern: $DAO.findById($ID)
      - pattern: $TABLE.selectAll().where { $TABLE.id eq $ID }
      - pattern: $TABLE.selectAll().where { $TABLE.id eq $ID }.firstOrNull()
  - pattern-not: $TABLE.selectAll().where { $TABLE.id eq $ID and ... }
  - metavariable-regex:
      metavariable: $REPO
      regex: .*Repository|.*Dao
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query
    provenance: ECO (Spring-Data-Kotlin, Exposed) — no ORM by-id in pool's kotlin MCP repos (their findById = in-memory registries in intellij-community); idiom from ecosystem