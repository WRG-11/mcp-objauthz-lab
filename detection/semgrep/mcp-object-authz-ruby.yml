rules:
- id: mcp-authz-scope-from-request-header-ruby
  languages:
  - ruby
  severity: WARNING
  message: A Rails/Sinatra MCP tool reads a tenant/identity header (X-Org-Id, X-Forwarded-For, ...) from the HTTP request and USES IT to select the authorization scope (e.g., passes it to a model scope, binds it as org_id in a query). A request header is entirely client-controlled -- any caller sets it -- so it must never decide whose data a tool returns. Derive the scope from the server-trusted session instead. CWE-639/CWE-290 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s10--forwarded-header-as-scope
  # Taint mode: the header read and the query are separate statements. The
  # earlier version put both under one `patterns` (which must match the same
  # range), compared header names without their quotes, and referenced
  # $HDRVAL/$KEY that no pattern bound, so it matched nothing. The finding is
  # reported at the value that selects the scope.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $R.headers[$HDR]
      - pattern: $R.headers.fetch($HDR, ...)
    - metavariable-regex:
        metavariable: $HDR
        regex: (?i)^["'](x-org-id|x-org|x-tenant-id|x-tenant|x-workspace-id|x-account-id|x-customer-id|x-project-id|x-user-id|x-forwarded-for|x-real-ip|x-client-ip)["']$
  # Rack env spelling of the same headers.
  - patterns:
    - pattern: $R.env[$HDR]
    - metavariable-regex:
        metavariable: $HDR
        regex: (?i)^["']HTTP_(X_ORG_ID|X_ORG|X_TENANT_ID|X_TENANT|X_WORKSPACE_ID|X_ACCOUNT_ID|X_CUSTOMER_ID|X_PROJECT_ID|X_USER_ID|X_FORWARDED_FOR|X_REAL_IP|X_CLIENT_IP)["']$
  pattern-sinks:
  # A scope-named key in a query hash. The `k: v` pattern also matches
  # `:k => v` (measured). client_ip is the IP-scoping variant of S10.
  - patterns:
    - pattern: '$M.$METHOD(..., $K: $V, ...)'
    - metavariable-regex:
        metavariable: $METHOD
        regex: (?i)^(where|rewhere|find_by!?|find_or_create_by!?|find_or_initialize_by)$
    - metavariable-regex:
        metavariable: $K
        regex: (?i)^:?["']?(org_id|tenant_id|workspace_id|project_id|organization_id|account_id|team_id|customer_id|client_ip)["']?$
    - focus-metavariable: $V
  # A finder by primary key; the call is the sink.
  - pattern: $M.find($V, ...)
  metadata:
    cwe:
    - CWE-639
    - CWE-290
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s10--forwarded-header-as-scope
    provenance: POOL (miru-web, woofed-crm, sepomex)

- id: mcp-wildcard-sentinel-scope-bypass-ruby
  languages:
  - ruby
  severity: ERROR
  message: A magic "all" or "*" sentinel value on a scope parameter is honored in an AUTHORIZATION CONTEXT (it controls whether to widen scope and return all tenants' data) without a role check. A textual "*" or "all" comparison in markup rendering, UI filters, or logging is NOT an authz decision and must stay silent. Gate wildcard scope on an explicit require_admin_role-style check, not on the parameter's literal value. CWE-639 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s4--wildcardsentinel-bypass
  patterns:
  - pattern-either:
      - pattern: $PARAM == "*"
      - pattern: $PARAM == "all"
  - metavariable-regex:
      metavariable: $PARAM
      regex: (?i).*(scope|org|tenant|project|team|workspace|account|user|owner|group|realm|namespace).*
  - pattern-either:
      - pattern: |
          if $PARAM == "*"
            ...
            $MODEL.$METHOD(...)
            ...
          end
      - pattern: |
          if $PARAM == "all"
            ...
            $MODEL.$METHOD(...)
            ...
          end
      - pattern: '$PARAM == "*" ? $WIDE : $SCOPED'
      - pattern: '$PARAM == "all" ? $WIDE : $SCOPED'
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab

- id: mcp-unscoped-query-object-fetch-ruby
  languages:
  - ruby
  severity: WARNING
  message: An object is fetched by id through a query that carries no tenant key (workspace_id / org_id / tenant_id / project_id ...), or fetched straight by primary key. If the entity is multi-tenant, any caller's id resolves regardless of tenant -- the query-scoped form of BOLA/IDOR, CWE-639. Bind the tenant key into the same filter, sourced from the session. CWE-639 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query
  # The id comes from the caller: either a Rails `params[...]` value, or a
  # parameter of the enclosing method (an MCP tool's `def call(id:)`; the
  # pattern matches positional and keyword parameters alike). The earlier
  # version only knew `params[...]`, so it matched nothing in its fixture.
  # An id from the server (`current_user.note_id`) is not S7.
  #
  # `find_by(id: $ID)` matches a one-key hash only, so a lookup that also binds
  # a tenant column (`find_by(id: id, org_id: org)`) stays silent. A chain such
  # as `Note.where(org_id: org).find(id)` or `current_company.notes.find(id)`
  # is not a bare model constant and stays silent through the $MODEL filter.
  # (A tenant-key pattern-not here was measured redundant and removed.)
  #
  # A background job's `perform(id)` gets its id from the server code that
  # enqueued it; the authorization check belongs at that enqueue site, which
  # this rule reaches through its own branches. `File.delete(path)` and
  # `Dir.delete(path)` are filesystem calls, not record lookups.
  patterns:
  - pattern-either:
    - patterns:
      - pattern-inside: |
          def $M(..., $ID, ...)
            ...
          end
      - metavariable-regex:
          metavariable: $M
          regex: ^(?!perform$)
      - pattern-either:
        - pattern: $MODEL.find($ID)
        - pattern: '$MODEL.find_by(id: $ID)'
        - pattern: '$MODEL.find_by!(id: $ID)'
        - pattern: '$MODEL.where(id: $ID).first'
        - pattern: $MODEL.delete($ID)
    - pattern-either:
      - pattern: $MODEL.find(params[:$K])
      - pattern: '$MODEL.find_by(id: params[:$K])'
      - pattern: '$MODEL.find_by!(id: params[:$K])'
      - pattern: '$MODEL.where(id: params[:$K]).first'
      - pattern: $MODEL.delete(params[:$K])
  - metavariable-regex:
      metavariable: $MODEL
      regex: ^(?!(File|Dir)$)[A-Z][A-Za-z0-9_]*$
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query
    provenance: POOL (miru-web 5 FIRE + 4 SILENT ideal canary; woofed-crm, sepomex)