rules:
- id: mcp-authz-scope-from-request-header-ruby
  languages:
  - ruby
  severity: WARNING
  message: A Rails/Sinatra MCP tool reads a tenant/identity header (X-Org-Id, X-Forwarded-For, ...) from the HTTP request and USES IT to select the authorization scope (e.g., passes it to a model scope, binds it as org_id in a query). A request header is entirely client-controlled -- any caller sets it -- so it must never decide whose data a tool returns. Derive the scope from the server-trusted session instead. CWE-639/CWE-290 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s10--forwarded-header-as-scope
  patterns:
  - pattern-either:
    - pattern: request.headers[$HDR]
    - pattern: request.headers.fetch($HDR, $FALLBACK)
  - metavariable-regex:
      metavariable: $HDR
      regex: (?i)^(x-org-id|x-org|x-tenant-id|x-tenant|x-workspace-id|x-account-id|x-customer-id|x-project-id|x-user-id|x-forwarded-for|x-real-ip|x-client-ip)$
  - pattern: $MODEL.$METHOD(..., $HDRVAL, ...)
  - metavariable-regex:
      metavariable: $METHOD
      regex: (?i)^(where|find|find_by|search|query|select|all).*
  metadata:
    cwe:
    - CWE-639
    - CWE-290
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s10--forwarded-header-as-scope

- id: mcp-wildcard-sentinel-scope-bypass-ruby
  languages:
  - ruby
  severity: ERROR
  message: A magic "all" or "*" sentinel value on a scope parameter is honored in an AUTHORIZATION CONTEXT (it controls whether to widen scope and return all tenants' data) without a role check. A textual "*" or "all" comparison in markup rendering, UI filters, or logging is NOT an authz decision and must stay silent. Gate wildcard scope on an explicit require_admin_role-style check, not on the parameter's literal value. CWE-639 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s4--wildcardsentinel-bypass
  patterns:
  - pattern-either:
    - pattern: $PARAM == "*"
    - pattern: $PARAM == "all"
  - metavariable-regex:
      metavariable: $PARAM
      regex: (?i).*(scope|org|tenant|project|team|workspace|account|user|owner|group|realm|namespace).*
  - pattern-either:
    - pattern: |
        if $PARAM == "*"
          ...
          $MODEL.$METHOD(...)
          ...
        end
    - pattern: |
        if $PARAM == "all"
          ...
          $MODEL.$METHOD(...)
          ...
        end
    - pattern: '$PARAM == "*" ? $WIDE : $SCOPED'
    - pattern: '$PARAM == "all" ? $WIDE : $SCOPED'
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab

- id: mcp-unscoped-query-object-fetch-ruby
  languages:
  - ruby
  severity: WARNING
  message: An object is fetched by id through a query that carries no tenant key (workspace_id / org_id / tenant_id / project_id ...), or fetched straight by primary key. If the entity is multi-tenant, any caller's id resolves regardless of tenant -- the query-scoped form of BOLA/IDOR, CWE-639. Bind the tenant key into the same filter, sourced from the session. CWE-639 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query
  patterns:
  - pattern-either:
    - pattern: $MODEL.find($ID)
    - pattern: '$MODEL.find_by(id: $ID)'
    - pattern: '$MODEL.where(id: $ID).first'
    - pattern: $MODEL.delete($ID)
  - metavariable-regex:
      metavariable: $MODEL
      regex: .*Model|.*Record
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query