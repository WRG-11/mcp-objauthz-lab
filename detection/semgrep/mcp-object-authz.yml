rules:
- id: mcp-missing-object-authz-check
  languages:
  - javascript
  - typescript
  - python
  severity: ERROR
  message: "An object resolved from storage by a client-supplied id reaches a mutation or response without an authorization/ownership check in between. This is the MCP object-level authorization pattern\
    \ (BOLA/IDOR, CWE-639/862) \xE2\u20AC\u201D see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s1--missing-org-scope-check-the-original\n"
  patterns:
  - pattern-either:
    - patterns:
      - pattern: '$OBJ = $STORE.$GETMETHOD($ID);

          ...

          $STORE.$MUTMETHOD($OBJ.$FIELD);

          '
      - metavariable-regex:
          metavariable: $MUTMETHOD
          regex: (?i)^(delete|update).*
    - patterns:
      - pattern: '$SESSION = $RESOLVE(...);

          ...

          $OBJ = $STORE.$GETMETHOD($ID);

          ...

          return ok($OBJ);

          '
  - metavariable-regex:
      metavariable: $GETMETHOD
      regex: (?i)^(get|find).*
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      requireOrgAccess(...);

      ...

      '
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      require_org_access(...);

      ...

      '
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      requireOwnership(...);

      ...

      '
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      require_ownership(...);

      ...

      '
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      requireAccess(...);

      ...

      '
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      require_access(...);

      ...

      '
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      checkAccess(...);

      ...

      '
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      check_access(...);

      ...

      '
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      checkOwnership(...);

      ...

      '
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      check_ownership(...);

      ...

      '
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      assertOwner(...);

      ...

      '
  - pattern-not: '$OBJ = $STORE.$GETMETHOD($ID);

      ...

      assert_owner(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      requireOrgAccess(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      require_org_access(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      requireOwnership(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      require_ownership(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      requireAccess(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      require_access(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      checkAccess(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      check_access(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      checkOwnership(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      check_ownership(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      assertOwner(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      assert_owner(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      requireAdminRole(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      require_admin_role(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      checkAdminRole(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      check_admin_role(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      assertAdminRole(...);

      ...

      '
  - pattern-not: '$SESSION = $RESOLVE(...);

      ...

      assert_admin_role(...);

      ...

      '
  metadata:
    cwe:
    - CWE-639
    - CWE-862
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab
- id: mcp-client-supplied-scope-overrides-session
  languages:
  - javascript
  - typescript
  - python
  severity: ERROR
  message: "A client-supplied scope or identity argument can override the server-trusted session scope. Arguments like org_id/tenant_id/ project_id/user_id must never select whose data a tool operates on\
    \ \xE2\u20AC\u201D always use the session's own scope and ignore (or reject) the caller-supplied value. CWE-639 \xE2\u20AC\u201D see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s2--scope-as-param\n"
  patterns:
  - pattern-either:
    - pattern: '$COND && $SCOPEPARAM ? $SCOPEPARAM : $SESSION.$FIELD'
    - pattern: $SCOPEPARAM || $SESSION.$FIELD
    - pattern: $SCOPEPARAM ?? $SESSION.$FIELD
  - metavariable-regex:
      metavariable: $SCOPEPARAM
      regex: (?i)^(org_id|orgid|tenant_id|tenantid|project_id|projectid|account_id|accountid|workspace_id|workspaceid|user_id|userid|owner_id|ownerid)$
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab
- id: mcp-wildcard-sentinel-scope-bypass
  languages:
  - javascript
  - typescript
  - python
  severity: ERROR
  message: A magic "all"/*" sentinel value on a scope parameter is honored in an AUTHORIZATION CONTEXT (it controls whether to widen scope and return all tenants' data) without a role check. A textual "*"
    or "all" comparison in markup rendering, UI filters, or logging is NOT an authz decision and must stay silent. Gate wildcard scope on an explicit requireAdminRole()-style check, not on the parameter's
    literal value. CWE-639 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s4--wildcardsentinel-bypass
  patterns:
  - pattern-either:
    - pattern: $PARAM === "*"
    - pattern: $PARAM === "all"
    - pattern: $PARAM == "*"
    - pattern: $PARAM == "all"
  - metavariable-regex:
      metavariable: $PARAM
      regex: (?i).*(scope|org|tenant|project|team|workspace|account|user|owner|group|realm|namespace).*
  - pattern-either:
    - patterns:
      - pattern: if ($PARAM === "*") { ... }
      - pattern-either:
        - pattern: $STORE.$METHOD()
        - pattern: return $STORE.$METHOD()
      - metavariable-regex:
          metavariable: $METHOD
          regex: (?i)^(listAll|all|getAll|findAll|selectAll).*
    - patterns:
      - pattern: if ($PARAM === "*") { ... }
      - pattern-either:
        - pattern: $FUNC()
        - pattern: return $FUNC()
      - metavariable-regex:
          metavariable: $FUNC
          regex: (?i).*(all|every|global|unscoped).*
    - pattern: '$PARAM === "*" ? $WIDE : $SCOPED'
    - pattern: '$PARAM === "all" ? $WIDE : $SCOPED'
    - pattern: '$PARAM == "*" ? $WIDE : $SCOPED'
    - pattern: '$PARAM == "all" ? $WIDE : $SCOPED'
    - patterns:
      - pattern: if ($PARAM === "*") { ... }
      - pattern-not: 'if ($PARAM === "*") { ... }

          ...

          $STORE.$METHOD({ ..., $KEY: $SESSION_ORG, ... })'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(orgId|org_id|tenantId|tenant_id|workspaceId|workspace_id|projectId|project_id|organizationId|organization_id|accountId|account_id|teamId|team_id|customerId|customer_id)$
  - pattern-not-inside: 'requireAdminRole(...);

      ...'
  - pattern-not-inside: 'require_admin_role(...);

      ...'
  - pattern-not-inside: 'checkAdminRole(...);

      ...'
  - pattern-not-inside: 'check_admin_role(...);

      ...'
  - pattern-not-inside: 'assertAdminRole(...);

      ...'
  - pattern-not-inside: 'assert_admin_role(...);

      ...'
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab
- id: mcp-batch-resolve-missing-per-item-scope-filter
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: "Multiple objects are resolved by client-supplied ids in a batch, but the surrounding code has no per-item scope filter (e.g. a \".filter(n => n.orgId === session.orgId)\" afterward). A sibling\
    \ list() tool is often correctly scoped while its batch-get sibling skips the per-object check \xE2\u20AC\u201D the \"list->get asymmetry\" pattern. CWE-862 \xE2\u20AC\u201D see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s3--listget-asymmetry\n"
  patterns:
  - pattern: $IDS.map($F => $STORE.$METHOD($F))
  - metavariable-regex:
      metavariable: $METHOD
      regex: (?i)^(get|find).*
  - metavariable-regex:
      metavariable: $STORE
      regex: ^(?!.*(?i)(map|cache|memo|index)$).*$
  - pattern-not-inside: '$RESOLVED = $IDS.map($F => $STORE.$METHOD($F));

      ...

      $RESOLVED.filter(...);

      '
  metadata:
    cwe:
    - CWE-862
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab
- id: mcp-admin-named-tool-missing-role-check
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: "A tool registered with an admin-sounding name never calls a role-check function in its handler. Naming a tool \"admin_*\" / \"*_admin_*\" is documentation, not enforcement \xE2\u20AC\u201D any\
    \ valid token can reach it unless the handler actually verifies the caller's role. CWE-863 \xE2\u20AC\u201D see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s5--roletoken-type-bypass\n"
  patterns:
  - pattern: server.registerTool($NAME, $SCHEMA, guard(async ($ARGS) => { ... }))
  - metavariable-regex:
      metavariable: $NAME
      regex: (?i).*admin.*
  - pattern-not-inside: "server.registerTool($NAME, $SCHEMA, guard(async ($ARGS) => {\n  ...\n  requireAdminRole(...);\n  ...\n}));\n"
  - pattern-not-inside: "server.registerTool($NAME, $SCHEMA, guard(async ($ARGS) => {\n  ...\n  checkAdminRole(...);\n  ...\n}));\n"
  - pattern-not-inside: "server.registerTool($NAME, $SCHEMA, guard(async ($ARGS) => {\n  ...\n  assertAdminRole(...);\n  ...\n}));\n"
  metadata:
    cwe:
    - CWE-863
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab
- id: mcp-client-supplied-scope-overrides-session-py-ternary
  languages:
  - python
  severity: ERROR
  message: "A client-supplied scope or identity argument can override the server-trusted session scope. Arguments like org_id/tenant_id/project_id/user_id must never select whose data a tool operates on\
    \ \xE2\u20AC\u201D always use the session's own scope and ignore (or reject) the caller-supplied value. CWE-639 \xE2\u20AC\u201D see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s2--scope-as-param\n"
  patterns:
  - pattern-either:
    - pattern: $SCOPEPARAM if $SCOPEPARAM else $SESSION.$FIELD
    - pattern: $SCOPEPARAM if $SCOPEPARAM is not None else $SESSION.$FIELD
  - metavariable-regex:
      metavariable: $SCOPEPARAM
      regex: (?i)^(org|tenant|project|team|workspace|account|user|owner|group|realm|namespace)_?id$
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab
- id: mcp-unscoped-query-object-fetch
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: 'An object is fetched by id through a query filter that carries no tenant key (workspaceId / projectId / organizationId / orgId / tenantId / accountId / userId / ownerId). If the entity is multi-tenant,
    the query matches on id alone and any caller''s id resolves regardless of tenant -- the query-scoped form of object-level authorization failure (BOLA / IDOR, CWE-639). This is the shape CVE-2026-54052
    (n8n, CVSS 9.6) took: a table fetched by a sequential id with the tenant column left out of the WHERE. Bind the tenant key into the same filter, sourced from the session, e.g. findOneBy({ id, workspaceId
    }). A guard-call detector never sees this, because there is no guard call to be missing -- the authorization is the tenant key inside the filter. Confirm the entity is genuinely tenant-scoped before
    treating this as a bug (a globally-owned table is a true negative).

    '
  patterns:
  - pattern-either:
    - pattern: $REPO.findOneBy($FILTER)
    - pattern: $REPO.findNoteBy($FILTER)
    - pattern: '$REPO.findOne({ where: $FILTER })'
    - pattern: $REPO.delete($FILTER)
    - pattern: $REPO.softDelete($FILTER)
  - metavariable-pattern:
      metavariable: $FILTER
      pattern: '{ id: $ID }'
  - pattern-not:
      patterns:
      - pattern-either:
        - pattern: '$REPO.$M({ ..., $KEY: $V })'
        - pattern: '$REPO.findOne({ where: { ..., $KEY: $V } })'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(workspaceId|projectId|organizationId|orgId|tenantId|accountId|userId|ownerId|teamId|realmId|namespaceId)$
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query
- id: mcp-write-parent-from-client-argument
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: "A create/save call takes its parent or tenant key from a caller-supplied argument rather than the authenticated session. A caller can then plant an object inside a tenant they do not belong\
    \ to (foreign-parent injection) even when every read path is correctly scoped. Bind the parent to the session's own scope, or verify membership of the supplied value before writing. CWE-639 \xE2\u20AC\
    \u201D see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s6--foreign-parent\n"
  patterns:
  - pattern: '$STORE.$METHOD({ ..., $KEY: $VAL, ... })'
  - metavariable-regex:
      metavariable: $METHOD
      regex: (?i)^(create|insert|add|save|put|write|new)([A-Z_].*)?$
  - metavariable-regex:
      metavariable: $KEY
      regex: (?i)^(orgId|org_id|tenantId|tenant_id|workspaceId|workspace_id|projectId|project_id|organizationId|organization_id|accountId|account_id|teamId|team_id|customerId|customer_id)$
  - metavariable-regex:
      metavariable: $VAL
      regex: ^(?!.*(?i)(session|ctx|context|auth|principal|claims|token|user)\.).*$
  - pattern-not-inside:
      patterns:
      - pattern: '$CHECK(...);

          ...

          $STORE.$METHOD({ ..., $KEY: $VAL, ... })

          '
      - metavariable-regex:
          metavariable: $CHECK
          regex: (?i)^(require|assert|ensure|check|verify|authorize|can|must)[A-Z_].*$
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s6--foreign-parent
- id: mcp-batch-resolve-missing-per-item-scope-filter-py
  languages:
  - python
  severity: WARNING
  message: 'Multiple objects are resolved by client-supplied ids in a batch comprehension, but the surrounding code applies no per-item scope filter back to the caller''s own scope (the list->get asymmetry,
    CWE-862). Filter resolved items by the session''s scope before returning them. See https://github.com/WRG-11/mcp-objauthz-lab#scenario-s3--listget-asymmetry

    '
  patterns:
  - pattern: $RESOLVED = [$STORE.$METHOD($F) for $F in $IDS]
  - metavariable-regex:
      metavariable: $METHOD
      regex: (?i)^(get|find).*
  - metavariable-regex:
      metavariable: $STORE
      regex: ^(?!.*(?i)(map|cache|memo|index)$).*$
  - pattern-not-inside: '$RESOLVED = [$STORE.$METHOD($F) for $F in $IDS]

      ...

      [$N for $N in $RESOLVED if ...]

      '
  metadata:
    cwe:
    - CWE-862
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab
- id: mcp-admin-named-tool-missing-role-check-py
  languages:
  - python
  severity: ERROR
  message: "A tool registered on an admin-sounding function never calls a role-check function in its body. Naming it \"admin_*\" / \"*_admin_*\" documents intent without enforcing it -- any valid token\
    \ reaches the handler unless the code verifies the caller's role. CWE-863 \xE2\u20AC\u201D see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s5--roletoken-type-bypass\n"
  patterns:
  - pattern-either:
    - pattern: "@$DEC\ndef $FUNC(...):\n    ...\n"
    - pattern: "@$DEC\nasync def $FUNC(...):\n    ...\n"
  - metavariable-regex:
      metavariable: $FUNC
      regex: (?i).*admin.*
  - pattern-not-inside: "@$DEC\ndef $FUNC(...):\n    ...\n    require_admin_role(...)\n    ...\n"
  - pattern-not-inside: "@$DEC\ndef $FUNC(...):\n    ...\n    check_admin_role(...)\n    ...\n"
  - pattern-not-inside: "@$DEC\ndef $FUNC(...):\n    ...\n    assert_admin_role(...)\n    ...\n"
  - pattern-not-inside: "@$DEC\ndef $FUNC(...):\n    ...\n    requireAdminRole(...)\n    ...\n"
  metadata:
    cwe:
    - CWE-863
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab
- id: mcp-unscoped-query-object-fetch-py
  languages:
  - python
  severity: WARNING
  message: 'An object is fetched through a query that carries an id but no tenant key (workspace_id / org_id / tenant_id / project_id ...), or fetched straight by primary key. If the entity is multi-tenant,
    any caller''s id resolves regardless of tenant -- the query-scoped form of BOLA/IDOR, CWE-639. Bind the tenant key into the same filter, sourced from the session. There is no guard call to be missing
    here -- the authorization IS the tenant key inside the filter. Confirm the entity is genuinely tenant-scoped before treating this as a bug. See https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query

    '
  patterns:
  - pattern-either:
    - pattern: $Q.filter_by(id=$ID)
    - patterns:
      - pattern: $S.get($MODEL, $ID)
      - metavariable-regex:
          metavariable: $MODEL
          regex: ^[A-Z][A-Za-z0-9]*$
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query
- id: mcp-write-parent-from-client-argument-py
  languages:
  - python
  severity: WARNING
  message: "A create/save call takes its parent or tenant key from a caller-supplied argument rather than the authenticated session. A caller can then plant an object inside a tenant they do not belong\
    \ to (foreign-parent injection) even when every read path is correctly scoped. Bind the parent to the session's own scope, or verify membership of the supplied value before writing. CWE-639 \xE2\u20AC\
    \u201D see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s6--foreign-parent\n"
  patterns:
  - pattern: $STORE.$METHOD(..., $KEY = $VAL, ...)
  - metavariable-regex:
      metavariable: $METHOD
      regex: (?i)^(create|insert|add|save|put|write|new)(_.*)?$
  - metavariable-regex:
      metavariable: $KEY
      regex: (?i)^(orgId|org_id|tenantId|tenant_id|workspaceId|workspace_id|projectId|project_id|organizationId|organization_id|accountId|account_id|teamId|team_id|customerId|customer_id)$
  - metavariable-regex:
      metavariable: $VAL
      regex: ^(?!.*(?i)(session|ctx|context|auth|principal|claims|token|user)\.).*$
  - pattern-not-inside:
      patterns:
      - pattern: '$CHECK(...)

          ...

          $STORE.$METHOD(..., $KEY = $VAL, ...)

          '
      - metavariable-regex:
          metavariable: $CHECK
          regex: (?i)^(require|assert|ensure|check|verify|authorize|can|must)
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s6--foreign-parent
- id: mcp-resource-uri-variable-used-as-scope
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: "An MCP resource read callback resolves an object using a URI template variable as the tenant/scope key. A resources/read URI is written entirely by the caller, the same as a tool argument, but\
    \ it is easy to mistake for a server-controlled path segment because it looks like routing rather than input \xE2\u20AC\u201D and MCP hosts often gate tool calls behind an approval prompt while treating\
    \ resource reads as inert. Bind the scope from the session resolved from the URI's identity variable instead. CWE-639 \xE2\u20AC\u201D see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s8--resource-uri-as-scope\n"
  patterns:
  - pattern-inside: 'async ($URI, { ... }) => { ... }

      '
  - pattern: '$STORE.$METHOD({ ..., $KEY: $VAL, ... })'
  - metavariable-regex:
      metavariable: $METHOD
      regex: (?i)^(find|get)([A-Z_].*)?$
  - metavariable-regex:
      metavariable: $KEY
      regex: (?i)^(orgId|org_id|tenantId|tenant_id|workspaceId|workspace_id|projectId|project_id|organizationId|organization_id|accountId|account_id|teamId|team_id|customerId|customer_id)$
  - metavariable-regex:
      metavariable: $VAL
      regex: ^(?!.*(?i)(session|ctx|context|auth|principal|claims|token|user)\.).*$
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s8--resource-uri-as-scope
- id: mcp-resource-uri-variable-used-as-scope-py
  languages:
  - python
  severity: WARNING
  message: "An MCP resource handler (@mcp.resource) resolves an object using a URI template variable as the tenant/scope key. Same defect as mcp-resource-uri-variable-used-as-scope, FastMCP spelling: the\
    \ template variable arrives as a function parameter instead of a destructured object. CWE-639 \xE2\u20AC\u201D see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s8--resource-uri-as-scope\n"
  patterns:
  - pattern-inside: "@$MCP.resource(...)\ndef $FUNC(...):\n    ...\n"
  - pattern: $STORE.$METHOD(..., $KEY = $VAL, ...)
  - metavariable-regex:
      metavariable: $KEY
      regex: (?i)^(org_id|tenant_id|workspace_id|project_id|organization_id|account_id|team_id|customer_id)$
  - metavariable-regex:
      metavariable: $VAL
      regex: ^(?!.*(?i)(session|ctx|context|auth|principal|claims|token|user)\.).*$
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s8--resource-uri-as-scope
- id: mcp-authz-scope-from-request-header
  languages:
  - javascript
