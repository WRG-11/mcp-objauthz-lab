rules:
- id: mcp-authz-scope-from-request-header-php
  languages:
  - php
  severity: WARNING
  message: A Laravel/Symfony MCP tool reads a tenant/identity header (X-Org-Id, X-Forwarded-For, ...) from the HTTP request and USES IT to select the authorization scope (e.g., passes it to an Eloquent query, binds it as org_id in a where clause). A request header is entirely client-controlled -- any caller sets it -- so it must never decide whose data a tool returns. Derive the scope from the server-trusted session instead. CWE-639/CWE-290 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s10--forwarded-header-as-scope
  # Taint mode: the header read and the query are separate statements. The
  # earlier version put both under one `patterns` (which must match the same
  # range), compared header names without their quotes, and referenced
  # $hdrval/$KEY inconsistently, so it matched nothing. The finding is
  # reported at the value that selects the scope.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $R->header($HDR, ...)
      - pattern: $R->headers->get($HDR, ...)
      - pattern: $R->getHeaderLine($HDR)
    - metavariable-regex:
        metavariable: $HDR
        regex: (?i)^["'](x-org-id|x-org|x-tenant-id|x-tenant|x-workspace-id|x-account-id|x-customer-id|x-project-id|x-user-id|x-forwarded-for|x-real-ip|x-client-ip)["']$
  - patterns:
    - pattern: $_SERVER[$HDR]
    - metavariable-regex:
        metavariable: $HDR
        regex: (?i)^["']HTTP_(X_ORG_ID|X_ORG|X_TENANT_ID|X_TENANT|X_WORKSPACE_ID|X_ACCOUNT_ID|X_CUSTOMER_ID|X_PROJECT_ID|X_USER_ID|X_FORWARDED_FOR|X_REAL_IP|X_CLIENT_IP)["']$
  pattern-sinks:
  # A scope-named column in a where clause. One pattern covers both
  # Model::where(...) and a chained ->where(...) (measured: each spelling
  # alone matches both). client_ip is the IP-scoping variant of S10.
  - patterns:
    - pattern: $Q->where($K, $V, ...)
    - metavariable-regex:
        metavariable: $K
        regex: (?i)^["'](org_id|tenant_id|workspace_id|project_id|organization_id|account_id|team_id|customer_id|client_ip)["']$
    - focus-metavariable: $V
  # A static finder by key; the call is the sink.
  - patterns:
    - pattern: $M::$METHOD($V, ...)
    - metavariable-regex:
        metavariable: $METHOD
        regex: (?i)^(find|findOrFail|findMany|firstWhere)$
  metadata:
    cwe:
    - CWE-639
    - CWE-290
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s10--forwarded-header-as-scope
    provenance: POOL (processwire-mcp requireAuth) + ECO (PSR-7); LOW CONFIDENCE - PHP pool uses Contao/ProcessWire not Eloquent; recommend taint (header-source -> auth-sink) not bare presence

- id: mcp-wildcard-sentinel-scope-bypass-php
  languages:
  - php
  severity: ERROR
  message: A magic "all" or "*" sentinel value on a scope parameter is honored in an AUTHORIZATION CONTEXT (it controls whether to widen scope and return all tenants' data) without a role check. A textual "*" or "all" comparison in markup rendering, UI filters, or logging is NOT an authz decision and must stay silent. Gate wildcard scope on an explicit requireAdminRole()-style check, not on the parameter's literal value. CWE-639 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s4--wildcardsentinel-bypass
  patterns:
  - pattern-either:
      - pattern: $PARAM === "*"
      - pattern: $PARAM === "all"
      - pattern: '"*" === $PARAM'
      - pattern: '"all" === $PARAM'
  - metavariable-regex:
      metavariable: $PARAM
      regex: (?i).*(scope|org|tenant|project|team|workspace|account|user|owner|group|realm|namespace).*
  - pattern-either:
      - pattern: |
          if ($PARAM === "*") {
            ...
            $MODEL::$METHOD(...);
            ...
          }
      - pattern: |
          if ($PARAM === "all") {
            ...
            $MODEL::$METHOD(...);
            ...
          }
      - pattern: '$PARAM === "*" ? $WIDE : $SCOPED'
      - pattern: '$PARAM === "all" ? $WIDE : $SCOPED'
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab

- id: mcp-unscoped-query-object-fetch-php
  languages:
  - php
  severity: WARNING
  message: An object is fetched by id through a query that carries no tenant key (workspace_id / org_id / tenant_id / project_id ...), or fetched straight by primary key. If the entity is multi-tenant, any caller's id resolves regardless of tenant -- the query-scoped form of BOLA/IDOR, CWE-639. Bind the tenant key into the same filter, sourced from the session. CWE-639 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query
  patterns:
  - pattern-either:
      - pattern: $MODEL::find($ID)
      - pattern: $MODEL::findOrFail($ID)
      - pattern: $MODEL::findByPk($ID)
      - pattern: $MODEL::findBy($COLS, $VALS)
      - pattern: $REPO->find($ID)
      - pattern: $MODEL::where('id', $ID)->first()
      - pattern: $MODEL::destroy($ID)
  - pattern-not:
      patterns:
        - pattern-either:
            - pattern: '$MODEL::findOneBy([..., "$TENANT" => $T, ...])'
            - pattern: '$MODEL::where(..., $TENANT, ...)->first()'
            - pattern: '$REPO->find($ID, $TENANT)'
        - metavariable-regex:
            metavariable: $TENANT
            regex: (?i)^(tenant_id|org_id|workspace_id|project_id|account_id|user_id|owner_id)$
  - metavariable-regex:
      metavariable: $MODEL
      regex: .*Model|.*Eloquent
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query
    provenance: "POOL (Contao/ProcessWire) + ECO (Eloquent); NOTE: PHP MCP pool uses Contao Models (Model::findBy) and ProcessWire selectors, NOT Laravel Eloquent - Eloquent confirmed only in ecosystem"