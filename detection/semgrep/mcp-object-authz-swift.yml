rules:
- id: mcp-authz-scope-from-request-header-swift
  languages:
  - swift
  severity: WARNING
  message: A Vapor/SwiftNIO MCP tool reads a tenant/identity header (X-Org-Id, X-Forwarded-For, ...) from the HTTP request and USES IT to select the authorization scope (e.g., passes it to a Fluent query, binds it as orgId in a filter). A request header is entirely client-controlled -- any caller sets it -- so it must never decide whose data a tool returns. Derive the scope from the server-trusted session instead. CWE-639/CWE-290 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s10--forwarded-header-as-scope
  patterns:
  - pattern-either:
    - pattern: $REQ.headers[$HDR]
    - pattern: $REQ.headers[$HDR].first
  - metavariable-regex:
      metavariable: $HDR
      regex: (?i)^(x-org-id|x-org|x-tenant-id|x-tenant|x-workspace-id|x-account-id|x-customer-id|x-project-id|x-user-id|x-forwarded-for|x-real-ip|x-client-ip)$
  - pattern: $REPO.$METHOD(..., $HDRVAL, ...)
  - metavariable-regex:
      metavariable: $METHOD
      regex: (?i)^(filter|query|find|all|first|get).*
  metadata:
    cwe:
    - CWE-639
    - CWE-290
    category: security
    confidence: MEDIUM
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s10--forwarded-header-as-scope

- id: mcp-wildcard-sentinel-scope-bypass-swift
  languages:
  - swift
  severity: ERROR
  message: A magic "all" or "*" sentinel value on a scope parameter is honored in an AUTHORIZATION CONTEXT (it controls whether to widen scope and return all tenants' data) without a role check. A textual "*" or "all" comparison in markup rendering, UI filters, or logging is NOT an authz decision and must stay silent. Gate wildcard scope on an explicit requireAdminRole()-style check, not on the parameter's literal value. CWE-639 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s4--wildcardsentinel-bypass
  patterns:
  - pattern-either:
    - pattern: $PARAM == "*"
    - pattern: $PARAM == "all"
  - metavariable-regex:
      metavariable: $PARAM
      regex: (?i).*(scope|org|tenant|project|team|workspace|account|user|owner|group|realm|namespace).*
  - pattern-either:
    - pattern: |
        if $PARAM == "*" {
          ...
          $REPO.$METHOD(...)
          ...
        }
    - pattern: |
        if $PARAM == "all" {
          ...
          $REPO.$METHOD(...)
          ...
        }
    - pattern: '$PARAM == "*" ? $WIDE : $SCOPED'
    - pattern: '$PARAM == "all" ? $WIDE : $SCOPED'
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab

- id: mcp-unscoped-query-object-fetch-swift
  languages:
  - swift
  severity: WARNING
  message: An object is fetched by id through a query that carries no tenant key (workspaceId / projectId / organizationId / orgId / tenantId / accountId / userId / ownerId). If the entity is multi-tenant, any caller's id resolves regardless of tenant -- the query-scoped form of BOLA/IDOR, CWE-639. Bind the tenant key into the same filter, sourced from the session. CWE-639 -- see https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query
  patterns:
  - pattern-either:
    - pattern: $REPO.find($ID)
    - pattern: $REPO.query(\.id == $ID).first()
    - pattern: $REPO.all().filter { it.id == $ID }.first
    - pattern: $REPO.delete($ID)
  - metavariable-regex:
      metavariable: $REPO
      regex: .*Repository|.*Model|.*Controller
  metadata:
    cwe:
    - CWE-639
    category: security
    confidence: LOW
    references:
    - https://github.com/WRG-11/mcp-objauthz-lab#scenario-s7--unscoped-query