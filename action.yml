name: 'MCP Object-Level Authorization Scanner'
description: >-
  Scan MCP server source for object-level / cross-tenant authorization bugs
  (BOLA/IDOR, CWE-639/862/863) using the mcp-objauthz-lab Semgrep rule-set.
author: 'WRG-11'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  path:
    description: 'Path to your MCP server source to scan'
    required: false
    default: '.'
  upload-sarif:
    description: >-
      Upload results to the GitHub Security tab. Requires the calling
      workflow to grant `security-events: write`.
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install semgrep
      shell: bash
      # Pinned: the rule set's findings depend on the engine version.
      run: pip install --quiet -r "$GITHUB_ACTION_PATH/detection/requirements.txt"

    - name: Run MCP object-authz scan (SARIF)
      shell: bash
      # Inputs reach the script through env, never through ${{ }} in the
      # script text: an expression is pasted in before bash parses it, so a
      # `path` built from a PR title or branch name would run as code.
      env:
        RULES_DIR: ${{ github.action_path }}/detection/semgrep/
        SCAN_PATH: ${{ inputs.path }}
      run: |
        # Exclude test files: a unit test or fixture intentionally contains the
        # vulnerable shape (a delete/fetch without a tenant key) as its subject,
        # so scanning them floods the report with non-production false positives.
        # Measured 2026-09-14: 11 of 36 write-parent findings in one real target
        # were test files. --no-git-ignore re-includes them, so exclude explicitly.
        semgrep --config "$RULES_DIR" \
          "$SCAN_PATH" --no-git-ignore --sarif \
          --exclude='*.test.*' --exclude='*.spec.*' \
          --exclude='test_*.py' --exclude='*_test.py' \
          --exclude='**/__tests__/**' --exclude='**/tests/**' --exclude='**/spec/**' \
          --output=mcp-objauthz-results.sarif

    - name: Upload SARIF to GitHub Security tab
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: mcp-objauthz-results.sarif

    - name: Fail if findings present
      shell: bash
      run: |
        count=$(python3 -c "
        import json
        d = json.load(open('mcp-objauthz-results.sarif', encoding='utf-8'))
        print(sum(len(r['results']) for r in d['runs']))
        ")
        echo "object-level authorization findings: $count"
        if [ "$count" -gt 0 ]; then
          echo "::error::$count object-level authorization finding(s) — see the Security tab (or rerun with --sarif locally) for detail."
          exit 1
        fi
